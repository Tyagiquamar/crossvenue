services:
  crossvenue:
    build: .
    ports:
      - "8471:8471"
    environment:
      CROSSVENUE_MODE: synthetic
      CROSSVENUE_POSTGRES_URL: postgres://crossvenue:crossvenue@postgres:5432/crossvenue?sslmode=disable
      CROSSVENUE_API_LISTEN: 0.0.0.0:8471
    volumes:
      - recordings:/data/recordings
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crossvenue
      POSTGRES_PASSWORD: crossvenue
      POSTGRES_DB: crossvenue
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossvenue"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  pgdata:
  recordings:
