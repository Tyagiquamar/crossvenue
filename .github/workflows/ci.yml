name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crossvenue
          POSTGRES_PASSWORD: crossvenue
          POSTGRES_DB: crossvenue
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crossvenue"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      CROSSVENUE_TEST_POSTGRES_URL: postgres://crossvenue:crossvenue@localhost:5432/crossvenue?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1 ./...
      - name: unit + integration tests
        run: go test ./...
      - name: failure scenes
        run: go test -count=1 -v ./tests/integration/ ./internal/engine/ ./internal/config/
      - name: race detector
        run: go test -race ./...
      - name: build
        run: |
          go build ./cmd/crossvenue
          go build ./cmd/replay
          go build ./cmd/loadgen

  replay-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true
      - name: deterministic replay parity (seed 42)
        run: |
          go run ./cmd/loadgen --venues 3 --symbols 1 --events-per-second 200 --duration 2s --seed 42 --out /tmp/ci.recording
          A=$(go run ./cmd/replay --recording /tmp/ci.recording --speed max | sha256sum)
          B=$(go run ./cmd/replay --recording /tmp/ci.recording --speed max | sha256sum)
          echo "run 1: $A"
          echo "run 2: $B"
          test "$A" = "$B"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
